services:
  db:
    build:
      context: ./db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ai_shop
      MARIADB_USER: ai_shop_user
      MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: sh -c "node migrate.js && node server.js"
    restart: unless-stopped

    expose:
      - "3000"

    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ai_shop_user
      DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      DB_NAME: ai_shop
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      app:
        condition: service_healthy

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:
