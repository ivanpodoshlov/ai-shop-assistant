<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --text: #181817;
            --muted: #777773;
            --line: #e8e8e4;
            --dark: #1d1d1b;
            --soft: #f0f0ed;
            --success: #2f7d55;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        body {
            min-height: 100vh;
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: min(920px, calc(100% - 40px));
            min-height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: var(--dark);
            color: white;
            font-size: 18px;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .02em;
        }

        .brand-subtitle {
            margin-top: 2px;
            font-size: 12px;
            color: var(--muted);
        }

        .online {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
        }

        .online::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 42px 0 26px;
        }

        #auth {
            width: min(390px, 100%);
            margin: auto;
            padding: 34px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
        }

        #auth h2 {
            margin: 0 0 8px;
            font-size: 26px;
            letter-spacing: -.04em;
        }

        .auth-copy {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            width: 100%;
            height: 48px;
            margin-bottom: 10px;
            padding: 0 15px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: white;
            outline: none;
            transition: border-color .15s;
        }

        .field:focus {
            border-color: #aaa;
        }

        .auth-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            height: 46px;
            border: 0;
            border-radius: 12px;
        }

        .btn-primary {
            background: var(--dark);
            color: white;
        }

        .btn-secondary {
            background: var(--soft);
            color: var(--text);
        }

        #logout {
            display: none;
        }

        #auth-status {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .welcome {
            margin: auto;
            text-align: center;
            padding: 50px 20px;
        }

        .welcome-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            border-radius: 17px;
            display: grid;
            place-items: center;
            background: var(--dark);
            color: white;
            font-size: 22px;
        }

        .welcome h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 40px);
            letter-spacing: -.045em;
        }

        .welcome p {
            margin: 12px auto 0;
            max-width: 450px;
            color: var(--muted);
            line-height: 1.6;
        }

        #answer {
            width: min(720px, 100%);
            margin: 0 auto;
            padding-bottom: 24px;
            white-space: normal;
            line-height: 1.65;
        }

        #answer:empty {
            display: none;
        }

        #answer p:first-child {
            margin-top: 0;
        }

        #answer p:last-child {
            margin-bottom: 0;
        }

        .composer-wrap {
            width: min(760px, 100%);
            margin: auto auto 0;
        }

        .composer {
            min-height: 62px;
            padding: 8px 8px 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.045);
        }

        #message {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
        }

        #message::placeholder {
            color: #aaa;
        }

        #send {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border: 0;
            border-radius: 14px;
            background: var(--dark);
            color: white;
            font-size: 20px;
        }

        #send:disabled {
            opacity: .45;
            cursor: default;
        }

        .account-bar {
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--muted);
            font-size: 12px;
        }

        .account-bar button {
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 12px;
        }
        .author {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #9ca3af;
            white-space: nowrap;
        }

        .author a {
            color: inherit;
            text-decoration: none;
        }

        .author a:hover {
            color: #4b5563;
        }

        @media (max-width: 600px) {
            .app {
                width: calc(100% - 24px);
            }

            header {
                height: 68px;
            }

            main {
                padding-top: 24px;
            }

            #auth {
                padding: 26px 20px;
                border-radius: 20px;
            }

            .auth-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">
    <header>
        <div class="brand">
            <div class="logo">✦</div>
            <div>
                <div class="brand-name">AI SHOP</div>
                <div class="brand-subtitle">Shopping assistant</div>
            </div>
        </div>

        <div class="online">Online</div>
    </header>

    <main>
        <div id="auth">
            <h2>Добро пожаловать</h2>
            <p class="auth-copy">
                Войдите в аккаунт, чтобы начать диалог с AI-ассистентом.
            </p>

            <input id="email" class="field" type="email" placeholder="Email">
            <input id="password" class="field" type="password" placeholder="Пароль">

            <div class="auth-actions">
                <button id="login" class="btn btn-primary">Войти</button>
                <button id="register" class="btn btn-secondary">Регистрация</button>
            </div>

            <button id="logout">Выйти</button>
            <div id="auth-status"></div>
        </div>

        <section class="chat">
            <div class="welcome">
                <div class="welcome-icon">✦</div>
                <h1>Чем могу помочь?</h1>
                <p>
                    Узнайте наличие и стоимость товара или попросите
                    ассистента оформить заказ.
                </p>
            </div>

            <div id="answer"></div>

            <div class="composer-wrap">
                <div class="composer">
                    <input
                        id="message"
                        type="text"
                        placeholder="Напишите сообщение..."
                        autocomplete="off"
                    >
                    <button id="send" aria-label="Отправить">↑</button>
                </div>

                <div class="account-bar">
                    <span id="account-label">AI Shop Assistant</span>
                    <button id="account-logout" type="button">Выйти</button>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="/vendor/marked/marked.umd.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script src="/app.js"></script>

<footer class="author">
    Built by <a href="https://podoshlov.com" target="_blank" rel="noopener noreferrer">Ivan Podoshlov</a> · 2026
</footer>

</body>
</html>
